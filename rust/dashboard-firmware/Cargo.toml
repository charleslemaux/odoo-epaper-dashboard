[package]
name = "dashboard-firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
dashboard-core = { path = "../dashboard-core" }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5" }
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-usb = { version = "0.6" }
embassy-usb-logger = { version = "0.6" }
log = { version = "0.4" }
heapless = { workspace = true }
static_cell = { version = "2" }
cortex-m = { version = "0.7" }
cortex-m-rt = { version = "0.7" }
embedded-io-async = { version = "0.7" }
rand_core = { version = "0.6" }
cyw43 = { version = "0.7", features = ["log"] }
cyw43-pio = "0.10"
embassy-net = { version = "0.9", features = ["dhcpv4", "tcp", "udp", "dns", "proto-ipv4", "medium-ethernet"] }
embedded-tls = { version = "0.19", default-features = false, features = ["rustpki"] }
